spring.application.name=gestao-de-pacientes

# Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gestao_pacientes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# Seguranca
jwt.secret=uma-chave-bem-grande-e-segura-com-mais-de-32-bytes